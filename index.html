<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ルーレット</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Arial", "Hiragino Kaku Gothic ProN", sans-serif;
      text-align: center;
      color: white;
      background:
        radial-gradient(circle at center, #273e75 0%, #101932 55%, #060a15 100%);
      overflow-x: hidden;
    }

    h1 {
      margin: 35px 10px 15px;
      font-size: clamp(32px, 7vw, 60px);
      color: #ffd700;
      text-shadow:
        0 0 8px #ff8c00,
        0 0 18px #ff4500,
        3px 3px 0 #7a2200;
    }

    .subtitle {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .roulette-area {
      position: relative;
      width: min(78vw, 480px);
      height: min(78vw, 480px);
      margin: 35px auto 25px;
    }

    /* 上の赤い矢印 */
    .pointer {
      position: absolute;
      z-index: 10;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 24px solid transparent;
      border-right: 24px solid transparent;
      border-top: 50px solid #ff3131;
      filter: drop-shadow(0 4px 3px rgba(0,0,0,.6));
    }

    #wheel {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 10px solid #ffd700;
      box-shadow:
        0 0 0 5px #8b4f00,
        0 0 25px #ffd700,
        0 15px 35px rgba(0,0,0,.5);

      /* 8分割 */
      background: conic-gradient(
        #e53935 0deg 45deg,
        #1565c0 45deg 90deg,
        #e53935 90deg 135deg,
        #1565c0 135deg 180deg,
        #ffd700 180deg 225deg,
        #1565c0 225deg 270deg,
        #e53935 270deg 315deg,
        #1565c0 315deg 360deg
      );
    }

    /* 各マスの文字 */
    .label {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 45%;
      height: 34px;
      margin-top: -17px;
      transform-origin: 0 50%;
      color: white;
      font-weight: bold;
      font-size: clamp(14px, 3.3vw, 21px);
      text-shadow:
        2px 2px 2px #000,
        -1px -1px 2px #000;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-right: 18px;
    }

    .label.win {
      color: #fff;
      font-size: clamp(16px, 4vw, 24px);
    }

    /* 中央の飾り */
    .center-cap {
      position: absolute;
      z-index: 5;
      width: 22%;
      height: 22%;
      left: 39%;
      top: 39%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff59d, #ffc107 35%, #e65100 100%);
      border: 6px solid white;
      box-shadow: 0 0 18px #ffd700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(18px, 5vw, 32px);
    }

    #button {
      width: min(75vw, 300px);
      padding: 17px 20px;
      border: 4px solid white;
      border-radius: 50px;
      background: linear-gradient(#ff5252, #b00000);
      color: white;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      box-shadow:
        0 7px 0 #650000,
        0 10px 18px rgba(0,0,0,.5);
      transition: transform .1s;
    }

    #button:active {
      transform: translateY(5px);
      box-shadow:
        0 2px 0 #650000,
        0 5px 10px rgba(0,0,0,.5);
    }

    #button.stop {
      background: linear-gradient(#ffe259, #e68a00);
      color: #5a2100;
      box-shadow:
        0 7px 0 #8f5200,
        0 10px 18px rgba(0,0,0,.5);
    }

    #button:disabled {
      cursor: default;
      opacity: .65;
    }

    #result {
      min-height: 75px;
      margin: 25px 10px;
      font-size: clamp(27px, 6vw, 42px);
      font-weight: bold;
      color: #ffd700;
      text-shadow: 2px 3px 3px black;
    }

    .small {
      opacity: .75;
      font-size: 13px;
      margin-bottom: 25px;
    }
  </style>
</head>

<body>

  <h1>🎯 ルーレット 🎯</h1>
  <div class="subtitle">運命のルーレット！</div>

  <div class="roulette-area">
    <div class="pointer"></div>

    <div id="wheel">
      <div class="label" style="transform: rotate(22.5deg)">はずれ</div>
      <div class="label" style="transform: rotate(67.5deg)">はずれ</div>
      <div class="label" style="transform: rotate(112.5deg)">はずれ</div>
      <div class="label" style="transform: rotate(157.5deg)">はずれ</div>

      <div class="label win" style="transform: rotate(202.5deg)">🎯 当たり</div>

      <div class="label" style="transform: rotate(247.5deg)">はずれ</div>
      <div class="label" style="transform: rotate(292.5deg)">はずれ</div>
      <div class="label" style="transform: rotate(337.5deg)">はずれ</div>

      <div class="center-cap">★</div>
    </div>
  </div>

  <button id="button">START!</button>

  <div id="result"></div>

  <div class="small">START → STOPでルーレットが止まります</div>

  <script>
    const wheel = document.getElementById("wheel");
    const button = document.getElementById("button");
    const result = document.getElementById("result");

    // 上から時計回りの8マス
    const items = [
      "はずれ",
      "はずれ",
      "はずれ",
      "はずれ",
      "🎯 当たり",
      "はずれ",
      "はずれ",
      "はずれ"
    ];

    let rotation = 0;
    let speed = 0;
    let spinning = false;
    let stopping = false;
    let previousTime = 0;

    function animate(time) {
      if (!spinning) return;

      if (!previousTime) previousTime = time;
      const delta = Math.min((time - previousTime) / 16.67, 2);
      previousTime = time;

      rotation += speed * delta;

      if (stopping) {
        // 徐々に減速
        speed *= Math.pow(0.987, delta);

        if (speed < 0.12) {
          spinning = false;
          stopping = false;
          speed = 0;

          finishRoulette();
          return;
        }
      }

      wheel.style.transform = `rotate(${rotation}deg)`;
      requestAnimationFrame(animate);
    }

    function finishRoulette() {
      /*
        CSSのルーレットは右（3時方向）から始まります。
        ポインターは上（12時方向）なので90度補正します。
      */
      const normalized = ((rotation % 360) + 360) % 360;
      const pointerAngle = ((270 - normalized) + 360) % 360;
      const index = Math.floor(pointerAngle / 45);

      const selected = items[index];

      if (selected.includes("当たり")) {
        result.textContent = "🎉 大当たり！！ 🎉";
      } else {
        result.textContent = "残念！ はずれ！";
      }

      button.textContent = "もう一度！";
      button.classList.remove("stop");
      button.disabled = false;
    }

    button.addEventListener("click", () => {

      // START
      if (!spinning) {
        result.textContent = "";
        button.textContent = "STOP!";
        button.classList.add("stop");

        spinning = true;
        stopping = false;
        speed = 12;
        previousTime = 0;

        requestAnimationFrame(animate);
        return;
      }

      // STOP
      if (spinning && !stopping) {
        stopping = true;
        button.textContent = "減速中...";
        button.disabled = true;
      }
    });
  </script>

</body>
</html>
